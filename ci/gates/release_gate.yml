name: release-production-gate
on:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pytest -q
      - run: python scripts/deep_checks.py
      - run: python scripts/token_launch_gate_check.py
